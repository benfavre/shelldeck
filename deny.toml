[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is transitive through russh's default rsa feature; the advisory records no patched release at all, and dropping the feature would remove RSA SSH key support" },
    { id = "RUSTSEC-2024-0384", reason = "instant is transitive through futures-lite 1 in adabraka_util 0.5.1, a crates.io sibling of the vendored GPUI that we do not fork" },
    { id = "RUSTSEC-2024-0436", reason = "paste reaches the lockfile through three independent chains (metal on macOS, pulp/exr, rav1e/ravif), all still on paste 1 at their latest releases" },
    { id = "RUSTSEC-2025-0052", reason = "async-std is a non-optional dependency of async-tar 0.5, pinned by adabraka_http_client 0.5.1; async-tar 0.6 gates it but the requirement cannot resolve there" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is transitive through zed-reqwest 0.12.15-zed, a Zed fork of reqwest 0.12.15 that stopped publishing; upstream reqwest already dropped it" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25 is transitive through cosmic-text 0.19 -> fontdb 0.23; fontdb 0.24 dropped it and pop-os/cosmic-text#526 is the open bump" },
]

[bans]
multiple-versions = "warn"
# Cargo-deny classifies versionless local workspace path dependencies as
# wildcards. ShellDeck intentionally uses those for its private crates.
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/benfavre/font-kit-fix",
    "https://github.com/bext-stack/automonique",
]
