[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is transitive through russh and RustSec has no patched release; retained temporarily for RSA SSH key compatibility" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is transitive through GTK3 macros in the Linux tray stack" },
    { id = "RUSTSEC-2024-0384", reason = "instant is transitive through the vendored GPUI futures-lite 1 stack" },
    { id = "RUSTSEC-2024-0412", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0413", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0415", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0416", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0418", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0419", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0420", reason = "GTK3 is required by the current Linux tray integration; migration requires replacing that desktop backend" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is transitive through the Linux GTK tray stack; ShellDeck does not use VariantStrIter" },
    { id = "RUSTSEC-2024-0436", reason = "paste is transitive through image codecs used by GPUI and has no in-place maintained release" },
    { id = "RUSTSEC-2025-0052", reason = "async-std is transitive through the vendored GPUI HTTP and async-tar stack" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is transitive through zed-reqwest in the vendored GPUI HTTP client" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is transitive through stacksafe in the vendored GPUI renderer" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25 is transitive through cosmic-text/fontdb and lopdf; both are already on their latest compatible release" },
]

[bans]
multiple-versions = "warn"
# Cargo-deny classifies versionless local workspace path dependencies as
# wildcards. ShellDeck intentionally uses those for its private crates.
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/benfavre/font-kit-fix",
    "https://github.com/bext-stack/automonique",
]
