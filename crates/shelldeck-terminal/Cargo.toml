[package]
name = "shelldeck-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shelldeck-core = { path = "../shelldeck-core" }
portable-pty = { workspace = true }
vte = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
smallvec = { workspace = true }
unicode-width = "0.2"
regex = "1"

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
# Dev-only cycle (allowed by Cargo): the attached backend is tested against a
# real daemon, which lives in the crate that depends on this one.
shelldeck-sessiond = { path = "../shelldeck-sessiond" }

[[bench]]
name = "terminal"
harness = false
