[package]
name = "shelldeck-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["app"]
# Everything the application needs on top of the emulator: `TerminalSession`
# and the `shelldeck-core` dependency it brings (configuration, keyring,
# HTTP). The session daemon builds without it, so the static binary that is
# uploaded to SSH servers links only the parser, the grid and the PTY
# (docs/design/session-daemon.md, section 2).
app = ["dep:shelldeck-core"]

[dependencies]
shelldeck-core = { path = "../shelldeck-core", optional = true }
portable-pty = { workspace = true }
vte = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
smallvec = { workspace = true }
unicode-width = "0.2"
regex = "1"

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
# Dev-only cycle (allowed by Cargo): the attached backend is tested against a
# real daemon, which lives in the crate that depends on this one.
shelldeck-sessiond = { path = "../shelldeck-sessiond" }

[[bench]]
name = "terminal"
harness = false
