ai.prompt.script_generate_form = "Retourne uniquement un objet JSON valide, sans bloc Markdown ni texte autour, avec exactement ces clés : {\"name\" :\"nom court\",\"description\" :\"description concise\",\"language\" :\"shell|python|node|bun|php|mysql|postgresql|docker|docker_compose|systemd|nginx\",\"category\" :\"system|database|web|runtime|container|network|security|custom|uncategorized\",\"body\" :\"corps brut du script\"}. Remplis tous les champs. Utilise la cible et le host sélectionnés lorsqu’ils sont pertinents. N’enregistre et n’exécute rien."
