[package]
name = "shelldeck-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
notify = { workspace = true }
keyring = { workspace = true }
auto-launch = { workspace = true }
ssh2-config = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
base64 = { workspace = true }
url = { workspace = true }
automonique-platform-client = { workspace = true }
automonique-protocol = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Already in the dependency tree transitively; used directly for
# `gethostname(2)` in util::hostname (env vars alone are unreliable on
# macOS/Linux — HOSTNAME is a shell variable, often not exported).
libc = "0.2"

[features]
default = []
# Compile the ACP transport probe for Jcode. The executor still falls back to
# the stable `jcode run` process path until ACP has a versioned public client
# contract we can rely on end-to-end.
jcode-acp = []

[package.metadata.i18n]
available-locales = ["fr", "en"]
default-locale = "fr"
load-path = "locales"
