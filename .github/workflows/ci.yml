name: CI

on:
  push:
    # `dev` is the integration branch and now receives merges directly, so it
    # needs its own signal — it is no longer just a fast-forward of a `main`
    # that CI already checked.
    branches: [main, dev]
    paths-ignore:
      - "*.md"
      - "LICENSE*"
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-x11-dev \
            libdbus-1-dev \
            libxdo-dev

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml — a floating nightly drops the
        # simd_fmin/simd_fmax intrinsics pathfinder_simd needs and silently
        # breaks the macOS release build (see AGENTS.md → Critical Rules).
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-06
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # The registry cache contains our applied lightweight crate patches.
          # Never restore a cache produced by a different patch/applicator
          # revision: a partially compatible source tree can make `patch`
          # apply only some hunks and fail before any tests run.
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('Cargo.lock', 'scripts/apply-crate-patches.sh', 'patches/diffs/*.patch') }}

      - name: Apply crate patches
        run: ./scripts/apply-crate-patches.sh

      # Dependency tests are not part of `cargo test --workspace`. Exercise
      # SDTEST-1745 directly after refreshing only portable-pty's published
      # standalone lockfile; ShellDeck's Cargo.lock remains untouched.
      - name: Test portable-pty Unix cwd authority regression
        shell: bash
        run: |
          crate_dir="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'portable-pty-0.9.0' | head -1)"
          test -n "$crate_dir"
          grep -F -q '// SDTEST-1745' "$crate_dir/src/cmdbuilder.rs"
          cargo update --manifest-path "$crate_dir/Cargo.toml"
          cargo test --manifest-path "$crate_dir/Cargo.toml" explicit_missing_unix_cwd_is_forwarded_instead_of_falling_back_home

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        # `--no-deps` skips lints from vendored path deps under `patches/`
        # (adabraka-gpui / adabraka-ui): we don't own that code and per
        # `.agents/patches.md` we don't creatively refactor upstream.
        run: cargo clippy --workspace --no-deps -- -D warnings

      - name: cargo fmt
        run: cargo fmt --all -- --check

  platform-core-tests:
    name: Core tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-06

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Keep patched registry sources coupled to the exact replay inputs.
          # Broad restore prefixes can resurrect an older partial SDPATCH.
          key: ${{ runner.os }}-cargo-core-test-${{ hashFiles('Cargo.lock', 'scripts/apply-crate-patches.sh', 'patches/diffs/*.patch') }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl pkg-config

      - name: Apply crate patches
        shell: bash
        run: ./scripts/apply-crate-patches.sh

      # The changed AppKit/GPUI tray path lives outside shelldeck-core. Keep a
      # native macOS compile gate for the actual application binary.
      - name: Check native macOS tray integration
        if: runner.os == 'macOS'
        run: cargo check -p shelldeck --bin shelldeck

      # ShellDeck's own PTY boundary must reject a vanished authorized cwd on
      # every supported OS before any native PTY or process side effect.
      - name: Test terminal cwd authority boundary
        run: cargo test -p shelldeck-terminal --lib missing_cwd_is_rejected_at_the_pty_boundary

      - name: Test portable-pty Unix cwd authority regression
        if: runner.os != 'Windows'
        shell: bash
        run: |
          crate_dir="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'portable-pty-0.9.0' | head -1)"
          test -n "$crate_dir"
          grep -F -q '// SDTEST-1745' "$crate_dir/src/cmdbuilder.rs"
          cargo update --manifest-path "$crate_dir/Cargo.toml"
          cargo test --manifest-path "$crate_dir/Cargo.toml" explicit_missing_unix_cwd_is_forwarded_instead_of_falling_back_home

      # SDPATCH-117 changes a cfg(windows) dependency branch. Run the patched
      # crate's focused unit directly because dependency tests are not part of
      # `cargo test --workspace`. The crate's published lockfile pins obsolete
      # compiler-internal proc-macro2 code, so refresh that standalone lockfile
      # before testing; ShellDeck's own locked dependency graph stays unchanged.
      # This still does not exercise CreateProcessW (SDTEST-1744 remains Yellow).
      - name: Test portable-pty Windows cwd authority regression
        if: runner.os == 'Windows'
        shell: bash
        run: |
          crate_dir="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'portable-pty-0.9.0' | head -1)"
          test -n "$crate_dir"
          grep -F -q '// SDTEST-1744' "$crate_dir/src/cmdbuilder.rs"
          cargo update --manifest-path "$crate_dir/Cargo.toml"
          cargo test --manifest-path "$crate_dir/Cargo.toml" explicit_missing_cwd_is_forwarded_instead_of_falling_back_home

      # SDPATCH-120 owns the ICO selector, CreateIconFromResourceEx boundary,
      # and fail-closed Explorer-restart custody. Run its vendored unit tests
      # explicitly because dependency tests are not part of ShellDeck's suite.
      - name: Test native Windows tray integration
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Path dependencies are intentionally outside the workspace, so copy
          # the vendored crate into the disposable runner temp tree to execute
          # its own unit tests without broadening `cargo test --workspace`.
          gpui_test_root="${RUNNER_TEMP}/shelldeck-gpui-test"
          mkdir -p "$gpui_test_root/patches" "$gpui_test_root/packaging/icons"
          cp -R patches/adabraka-gpui "$gpui_test_root/patches/"
          cp packaging/icons/shelldeck.ico "$gpui_test_root/packaging/icons/"
          cp Cargo.lock "$gpui_test_root/patches/adabraka-gpui/Cargo.lock"
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target" \
            cargo test --manifest-path "$gpui_test_root/patches/adabraka-gpui/Cargo.toml" --lib sdtest_181
          cargo test -p shelldeck --bin shelldeck sdtest_1812_windows_tray_asset_is_a_decodable_ico

      - name: Test shelldeck-core
        run: cargo test -p shelldeck-core

      # `shelldeck-update` owns the binary-replacement paths, which differ per
      # platform and are the ones that can leave a user without an executable.
      # No GPUI, so it builds as cheaply as core here.
      - name: Test shelldeck-update
        run: cargo test -p shelldeck-update

      # The keychain round-trips are `#[ignore]`d by default because they need
      # a real credential store. macOS and Windows runners have one; Linux does
      # not (no Secret Service on the runner), so this step is per-OS.
      - name: Native keychain round-trip (macOS)
        if: runner.os == 'macOS'
        # Bounded on purpose: an unexpected keychain access prompt would block
        # until the 30-minute job timeout and report nothing useful.
        timeout-minutes: 5
        env:
          SHELLDECK_LIVE_KEYCHAIN: "1"
        run: |
          # A throwaway keychain, created and destroyed inside this step: the
          # runner's login keychain is never touched and nothing outlives the
          # job. `set-keychain-settings` with no flags disables the idle
          # auto-lock that would otherwise make the round-trip flaky.
          security create-keychain -p shelldeck-ci shelldeck-ci.keychain
          security set-keychain-settings shelldeck-ci.keychain
          security unlock-keychain -p shelldeck-ci shelldeck-ci.keychain
          security list-keychains -d user -s shelldeck-ci.keychain
          security default-keychain -s shelldeck-ci.keychain
          # Filter on the full module path: `-- --ignored live_` would also
          # catch the cloud_sync live smoke test, which hits the real Manage.
          cargo test -p shelldeck-core -- --ignored config::keychain::tests::live_
          security delete-keychain shelldeck-ci.keychain

      - name: Native credential round-trip (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          SHELLDECK_LIVE_KEYCHAIN: "1"
        # Credential Manager is per-user and the runner user is disposable, so
        # there is no shared store to isolate. Each test still writes under a
        # pid+nanos host name and deletes it.
        run: cargo test -p shelldeck-core -- --ignored config::keychain::tests::live_
