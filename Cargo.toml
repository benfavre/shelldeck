[workspace]
resolver = "2"
members = [
    "crates/shelldeck",
    "crates/shelldeck-core",
    "crates/shelldeck-ssh",
    "crates/shelldeck-terminal",
    "crates/shelldeck-ui",
    "crates/shelldeck-update",
]

[workspace.package]
version = "0.9.4"
edition = "2021"
license = "MIT"
authors = ["ShellDeck Contributors"]
description = "GPU-accelerated native desktop terminal and SSH companion app"
repository = "https://github.com/benfavre/shelldeck"
homepage = "https://github.com/benfavre/shelldeck"

[workspace.dependencies]
# GPUI framework (via adabraka fork)
gpui = { package = "adabraka-gpui", version = "0.5" }
adabraka-ui = { version = "0.3", features = ["markdown"] }

# SSH
russh = { version = "0.60.3" }
ssh2-config = "0.2"

# Terminal
portable-pty = "0.9"
vte = "0.13"

# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-process = "2"
async-io = "2"
futures-lite = "2"
smol = "2"
same-file = "1"
rustix = { version = "0.38", features = ["fs", "process", "termios"] }
agent-client-protocol = "=2.0.0"

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
directories = "6"
notify = "8.2"
# Platform credential stores are all behind feature flags in keyring 3: with
# none enabled, `keyring::default` resolves to the in-process **mock** store on
# every OS, so nothing is ever persisted. The deps are target-gated upstream,
# so naming all three here costs nothing on the other platforms. `crypto-rust`
# keeps the Secret Service session encryption off OpenSSL.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
auto-launch = "0.5"
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
parking_lot = "0.12"
fs2 = "0.4"
smallvec = "1.13"
once_cell = "1.19"
pulldown-cmark = { version = "0.12", default-features = false }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
semver = "1"
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
criterion = "0.5"
automonique-platform-client = { git = "https://github.com/bext-stack/automonique", rev = "c1e772e37371ba00825923f8f35ffc652c0a4e95" }
automonique-protocol = { git = "https://github.com/bext-stack/automonique", rev = "c1e772e37371ba00825923f8f35ffc652c0a4e95" }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[patch.crates-io]
adabraka-gpui = { path = "patches/adabraka-gpui" }
# Local fork of adabraka-ui with:
#   - `InputState` cursor color pulled from `theme.tokens.ring` instead of a
#     hardcoded #0066ff.
#   - Cursor blink (~500 ms on/off) driven by `Instant::now()` inside the
#     input's paint, requesting an animation frame while focused.
adabraka-ui = { path = "patches/adabraka-ui" }
# Fix core-graphics 0.24 vs 0.25 conflict on macOS (zed-font-kit depends on core-graphics 0.24)
zed-font-kit = { git = "https://github.com/benfavre/font-kit-fix", branch = "fix-core-graphics" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
strip = true
